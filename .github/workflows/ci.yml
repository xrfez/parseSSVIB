name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:     # the "Run workflow" button

# A new push cancels the run still going for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2' # the build uses its bundled atlas

      # Safe here: a CI checkout has no local working copies under deps/.
      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Check the lock, nim.cfg and deps/ agree
        run: nim depsCheck

      # nimpretty has no check mode: format to a copy and fail on any diff.
      - name: Verify code formatting
        run: |
          shopt -s globstar nullglob
          status=0
          for f in src/**/*.nim tests/**/*.nim bench/**/*.nim tools/**/*.nim; do
            out="$RUNNER_TEMP/fmt/$f"
            mkdir -p "$(dirname "$out")"
            nimpretty --indent:2 --maxLineLen:100 --out:"$out" "$f"
            diff -u "$f" "$out" || status=1
          done
          exit $status

      - name: Run the tests (debug)
        run: nim test

      - name: Run the tests (release and danger)
        run: nim testRelease

      - name: Build the API docs
        run: nim docs

      - name: Run the benchmark on synthetic files
        run: nim bench

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Fetch dependencies (Atlas)
        run: atlas rep atlas.lock

      - name: Run the tests (debug)
        run: nim test

      - name: Run the tests (release and danger)
        run: nim testRelease
